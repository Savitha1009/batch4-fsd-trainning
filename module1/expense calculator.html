<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Personal Expense Calculator</h1>
        <p>Track your income, expenses and savings</p>
    </header>


    <!-- Main Container -->
    <main>

        <!-- Income Section -->
        <section class="card">

            <h2>Income</h2>

            <label for="income">Enter Monthly Income:</label>

            <input
                type="number"
                id="income"
                placeholder="Enter income"
                min="0"
            >

        </section>


        <!-- Expense Section -->
        <section class="card">

            <h2>Add Expense</h2>

            <label for="expenseName">Expense Name:</label>

            <input
                type="text"
                id="expenseName"
                placeholder="Example: Food"
            >


            <label for="expenseAmount">Expense Amount:</label>

            <input
                type="number"
                id="expenseAmount"
                placeholder="Enter amount"
                min="0"
            >


            <label for="category">Category:</label>

            <select id="category">

                <option value="Food">Food</option>

                <option value="Transport">Transport</option>

                <option value="Education">Education</option>

                <option value="Shopping">Shopping</option>

                <option value="Entertainment">Entertainment</option>

                <option value="Others">Others</option>

            </select>


            <button onclick="addExpense()">
                Add Expense
            </button>

        </section>


        <!-- Expense List -->
        <section class="card">

            <h2>Expense Details</h2>

            <ul id="expenseList">
                <!-- Expenses will appear here -->
            </ul>

        </section>


        <!-- Summary Section -->
        <section class="card summary">

            <h2>Summary Report</h2>

            <p>
                Total Income:
                ₹<span id="totalIncome">0</span>
            </p>

            <p>
                Total Expenses:
                ₹<span id="totalExpenses">0</span>
            </p>

            <p>
                Savings:
                ₹<span id="savings">0</span>
            </p>

            <p>
                Expense Status:
                <span id="status">No expenses added</span>
            </p>

            <button onclick="calculateSummary()">
                Calculate Summary
            </button>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Personal Expense Calculator
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
